{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortifyAI - Generating Portfolio</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .loading-container {
            text-align: center;
            z-index: 10;
        }
        
        .scanner-box {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto 3rem auto;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .scanner-box i {
            font-size: 6rem;
            color: var(--primary);
            opacity: 0.5;
            animation: pulse-icon 2s infinite ease-in-out;
        }

        @keyframes pulse-icon {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--cyan);
            box-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .loading-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;  
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-text {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 500;
            height: 30px; /* fixed height to prevent jumping */
        }
        
        .progress-bar-container {
            width: 100%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 2rem auto;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            border-radius: 10px;
            box-shadow: 0 0 10px var(--cyan);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="bg-glowing-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="bg-grid"></div>

    <div class="loading-container">
        <div class="scanner-box">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <div class="scanner-line"></div>
        </div>
        <h1 class="loading-title">Polishing Your Data...</h1>
        <div class="status-text" id="statusText">Initiating AI Refinement...</div>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        const statuses = [
            "Applying AI Polish...",
            "Structuring Layouts...",
            "Formatting Experience...",
            "Highlighting Key Skills...",
            "Finalizing Portfolio..."
        ];
        
        const statusEl = document.getElementById('statusText');
        const progressEl = document.getElementById('progressBar');
        
        let step = 0;
        const totalSteps = statuses.length;
        const timePerStep = 1800; // 1.8 seconds per step to roughly match 9-10s Gemini response time
        
        function updateStatus() {
            if (step < totalSteps) {
                statusEl.textContent = statuses[step];
                const progress = ((step + 1) / totalSteps) * 100;
                progressEl.style.width = progress + '%';
                step++;
                setTimeout(updateStatus, timePerStep);
            } else {
                statusEl.textContent = "Almost there...";
            }
        }
        
        // Start animation
        setTimeout(updateStatus, 500);

        // Immediately trigger the background process
        window.location.href = "{% url 'processPortfolio' %}";
    </script>
</body>
</html>
