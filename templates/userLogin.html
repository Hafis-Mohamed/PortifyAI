{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortifyAI - Sign In</title>
    <!-- FontAwesome for beautiful dev icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Premium Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 420px; /* Slightly narrower than registration for a cleaner look */
            padding: 3rem;
            position: relative;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-header .logo {
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.9rem 1.2rem;
            color: white;
            font-family: var(--font);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--border-hover);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .form-control::placeholder {
            color: var(--text-dark);
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.05rem;
            margin-top: 1rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--cyan);
            font-weight: 600;
        }

        .auth-footer a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <!-- Glowing Background Elements -->
    <div class="bg-glowing-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="bg-grid"></div>

    <div class="auth-container">
        <!-- Reusing our glass-panel aesthetic -->
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <a href="/" class="logo">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>PortifyAI</span>
                </a>
                <h1>Welcome back</h1>
                <p>Sign in to your PortifyAI account.</p>
            </div>

            <form action="" method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary auth-btn">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/user_registration/">Register here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
